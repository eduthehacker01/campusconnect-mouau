      const [bloggers] = useState(INITIAL_BLOGGERS);
      const [food] = useState(INITIAL_FOOD);
      const [lostFound, setLostFound] = useState(INITIAL_LOST_FOUND);

      // Interactive user states
      const [approvedUserProducts, setApprovedUserProducts] = useState(0); // First 2 FREE rule
      const [rsvpState, setRsvpState] = useState({}); // { eventId: 'interested' | 'going' }
      const [followedUsers, setFollowedUsers] = useState({});
      const [joinedGroups, setJoinedGroups] = useState({ 801: true });
      const [interestFilter, setInterestFilter] = useState("All");
      const [jobTypeFilter, setJobTypeFilter] = useState("All");
      const [marketCategory, setMarketCategory] = useState("All");

      // Governance, Reporting & Roadmap state
      const [reports, setReports] = useState([]);
      const [pendingAds, setPendingAds] = useState([]);
      const [suggestions, setSuggestions] = useState([
        { id: 1, text: "Add a roommate compatibility quiz for off-campus lodges around 82 Bus Stop", votes: 47 },
        { id: 2, text: "Verified student ride-sharing between Umuahia town and MOUAU morning lectures", votes: 39 },
      ]);
      const [newSuggestion, setNewSuggestion] = useState("");

      // Modals
      const [postModalOpen, setPostModalOpen] = useState(false);

      const [adminModalOpen, setAdminModalOpen] = useState(false);
      const [dmTarget, setDmTarget] = useState(null);
      const [dmText, setDmText] = useState("");

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 3200);
        return () => clearTimeout(t);
      }, [toast]);

      const freePostsLeft = Math.max(0, 2 - approvedUserProducts);

      const handleReport = (itemTitle, section) => {
        setReports((prev) => [{ id: Date.now(), itemTitle, section, time: "Just now" }, ...prev]);
        setToast(`Reported "${itemTitle}" to Admin Trust & Safety team.`);
      };

      const handleRsvp = (eventId, type) => {
        const current = rsvpState[eventId];
        if (current === type) return;
        setEvents((prev) =>
          prev.map((ev) => {
            if (ev.id !== eventId) return ev;
            return {
              ...ev,
              interested: type === "interested" ? ev.interested + 1 : current === "interested" ? ev.interested - 1 : ev.interested,
              going: type === "going" ? ev.going + 1 : current === "going" ? ev.going - 1 : ev.going,
            };
          })
        );
        setRsvpState((prev) => ({ ...prev, [eventId]: type }));
        setToast(type === "going" ? "You're marked as GOING! Reminder set 🔔" : "Marked as INTERESTED ⭐");
      };

      // Filter helper for campus & search
      const matchesFilter = (item, fields) => {
        const locOk =
          campusFilter === "All Locations" ||
          !item.location ||
          item.location.toLowerCase().includes(campusFilter.split(",")[0].toLowerCase());
        const q = search.trim().toLowerCase();
        const searchOk = !q || fields.some((f) => f && String(f).toLowerCase().includes(q));
        return locOk && searchOk;
      };

      /* ---------------- Sub-Modal: Create Universal Listing ---------------- */
      function UniversalPostModal() {
        const [postType, setPostType] = useState("marketplace");
        const [title, setTitle] = useState("");
        const [category, setCategory] = useState("Electronics");
        const [condition, setCondition] = useState("Used");
        const [price, setPrice] = useState("");
        const [location, setLocation] = useState("MOUAU, Umudike");
        const [description, setDescription] = useState("");
        const [whatsapp, setWhatsapp] = useState("");

        if (!postModalOpen) return null;

        const submitPost = (e) => {
          e.preventDefault();
          if (!title.trim() || !whatsapp.trim()) {
            setToast("Please enter a title and WhatsApp contact.");
            return;
          }

          if (postType === "marketplace") {
            const isFree = approvedUserProducts < 2;
            setMarketplace((prev) => [
              {
                id: Date.now(),
                name: title.trim(),
                category,
                condition,
                price: price.trim() || "Negotiable",
                location,
                seller: `${user.name} (${isFree ? "Free Quota" : "Paid Listing"})`,
                verified: true,
                description: description.trim(),
                whatsapp,
              },
              ...prev,
            ]);
            setApprovedUserProducts((c) => c + 1);
            setActiveSection("marketplace");
            setToast(
              isFree
                ? `Product listed FREE! (${Math.max(0, 1 - approvedUserProducts)} free listing remaining)`
                : "Paid Marketplace product published!"
            );
          } else if (postType === "job") {
            setJobs((prev) => [
              {
                id: Date.now(),
                title: title.trim().toUpperCase(),
                type: category || "Part-time",
                employer: user.name,
                verified: true,
                location,
                hours: "To be discussed",
                salary: price.trim() || "To be discussed",
                deadline: "Open",
                description: description.trim(),
                requirements: ["Honesty and punctuality", "Good communication skills"],
                whatsapp,
                featured: false,

                type: category || "Self-Contained",

                  <h2 className="text-2xl font-extrabold text-white">🎉 Campus Events & Live RSVPs</h2>
                  <p className="text-xs text-blue-200/80">Click "I'm Interested" or "Going" to RSVP and receive an automatic event reminder.</p>
                </div>

                <div className="grid gap-5 md:grid-cols-2">
                  {events.filter((ev) => matchesFilter(ev, [ev.title, ev.venue, ev.description])).map((ev) => {
                    const userChoice = rsvpState[ev.id];
                    return (
                      <div key={ev.id} className="flex flex-col justify-between rounded-2xl border border-blue-800/50 bg-slate-900/90 p-5 shadow-lg">
                        <div>
                          <div className="flex items-center justify-between">
                            <span className="rounded-full bg-amber-500 px-3 py-0.5 text-[10px] font-black uppercase text-slate-950">
                              {ev.category}
                            </span>
                            <span className="text-xs font-extrabold text-emerald-400">Entry: {ev.fee}</span>
                          </div>
                          <h3 className="mt-3 text-lg font-extrabold text-white">{ev.title}</h3>
                          <p className="mt-1 text-xs font-semibold text-blue-300">🗓 {ev.date} • 📍 {ev.venue}</p>
                          <p className="mt-0.5 text-[11px] text-blue-300/70">Organiser: {ev.organiser}</p>
                          <p className="mt-2.5 text-xs text-blue-100/85">{ev.description}</p>
                        </div>

                        <div className="mt-4 space-y-2.5">
                          <div className="flex gap-2">
                            <button
                              onClick={() => handleRsvp(ev.id, "interested")}
                              className={`flex-1 rounded-xl py-2 text-xs font-bold transition ${
                                userChoice === "interested"
                                  ? "bg-amber-500 text-slate-950"
                                  : "border border-blue-700 bg-blue-950/70 text-blue-200 hover:bg-blue-900"
                              }`}>
                              ⭐ I'm Interested ({ev.interested})
                            </button>
                            <button
                              onClick={() => handleRsvp(ev.id, "going")}
                              className={`flex-1 rounded-xl py-2 text-xs font-bold transition ${
                                userChoice === "going"
                                  ? "bg-emerald-600 text-white"
                                  : "border border-blue-700 bg-blue-950/70 text-blue-200 hover:bg-blue-900"
                              }`}>
                              🔔 Going ({ev.going})
                            </button>
                          </div>
                          <a href={`https://wa.me/${formatWhatsApp(ev.whatsapp)}`} target="_blank" rel="noopener noreferrer"
                             className="block w-full rounded-xl bg-blue-600 py-2 text-center text-xs font-bold text-white hover:bg-blue-500">
                            Contact Organiser / Register
                          </a>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            )}

            {/* ====================================================================
               SECTION 6: OPPORTUNITIES (SCHOLARSHIPS, SIWES, GRANTS, BOOTCAMPS)
               ==================================================================== */}
            {activeSection === "opportunities" && (
              <section>
                <div className="mb-5 rounded-2xl border border-blue-800/50 bg-blue-950/60 p-5">
                  <span className="text-xs font-bold uppercase text-amber-400">Verified Academic & Career Growth</span>
                  <h2 className="text-2xl font-extrabold text-white">🎓 Scholarships, SIWES, Internships & Grants</h2>
                  <p className="text-xs text-blue-200/80">Every opportunity includes eligibility requirements, original source and expiry countdown so outdated links never circulate.</p>
                </div>

                <div className="grid gap-5 md:grid-cols-2">
                  {opportunities.map((op) => (
                    <div key={op.id} className="flex flex-col justify-between rounded-2xl border border-blue-800/50 bg-slate-900/90 p-5 shadow-lg">
                      <div>
                        <div className="flex items-center justify-between">
                          <span className="rounded-full bg-emerald-500/20 border border-emerald-400/40 px-3 py-0.5 text-xs font-bold text-emerald-300">
                            {op.type}
                          </span>
                          <span className="rounded-full bg-amber-500/20 px-2.5 py-0.5 text-xs font-bold text-amber-300">
                            ⏳ {op.deadline}
                          </span>
                        </div>
                        <h3 className="mt-3 text-base font-extrabold text-white">{op.title}</h3>
                        <p className="mt-1 text-xs text-blue-300">Source: {op.source}</p>
                        <p className="mt-2 text-xs text-blue-100/85"><strong>Eligibility:</strong> {op.eligibility}</p>
                        <p className="mt-2 text-sm font-black text-amber-400">Award / Benefit: {op.grant}</p>
                      </div>
                      <a href={op.link} target="_blank" rel="noopener noreferrer"
                         className="mt-4 block w-full rounded-xl bg-blue-600 py-2.5 text-center text-xs font-bold text-white hover:bg-blue-500">
                        Visit Official Application Portal ↗
                      </a>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* ====================================================================
               SECTION 7: SERVICES DIRECTORY
               ==================================================================== */}
            {activeSection === "services" && (
              <section>
                <div className="mb-5 flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-blue-800/50 bg-blue-950/60 p-5">
                  <div>
                    <span className="text-xs font-bold uppercase text-amber-400">Monetize Your Skills</span>
                    <h2 className="text-2xl font-extrabold text-white">🛠️ Student & Local Services Directory</h2>
                    <p className="text-xs text-blue-200/80">Hire verified students for web design, hairdressing, barbing, photography, laundry, repairs & private tutoring.</p>
                  </div>
                  <button onClick={() => setPostModalOpen(true)} className="rounded-xl bg-green-600 px-4 py-2.5 text-xs font-bold text-white">
                    + List Your Skill / Service
                  </button>
                </div>

                <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
                  {services.filter((s) => matchesFilter(s, [s.title, s.category, s.provider, s.description])).map((sv) => (
                    <div key={sv.id} className="flex flex-col justify-between rounded-2xl border border-blue-800/50 bg-slate-900/90 p-5 shadow-lg">
                      <div>
                        <div className="flex items-center justify-between">
                          <span className="rounded-full bg-blue-600 px-2.5 py-0.5 text-[10px] font-bold text-white">{sv.category}</span>
                          <span className="text-xs font-bold text-amber-400">{sv.rating}</span>
                        </div>
                        <h3 className="mt-3 text-base font-bold text-white">{sv.title}</h3>
                        <p className="mt-1 text-xs text-blue-300">Provider: {sv.provider} {sv.verified && "✔"}</p>
                        <p className="mt-2 text-xs text-blue-100/80">{sv.description}</p>
                        <p className="mt-3 text-sm font-extrabold text-emerald-400">{sv.price}</p>
                      </div>
                      <a href={`https://wa.me/${formatWhatsApp(sv.whatsapp)}`} target="_blank" rel="noopener noreferrer"
                         className="mt-4 block w-full rounded-xl bg-green-600 py-2.5 text-center text-xs font-bold text-white hover:bg-green-500">
                        Book Service on WhatsApp
                      </a>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* ====================================================================
               SECTION 8: ACCOMMODATION & ROOMMATES
               ==================================================================== */}
            {activeSection === "accommodation" && (
              <section>
                <div className="mb-4 rounded-2xl border border-amber-400/40 bg-amber-500/10 p-4 text-xs text-amber-200">
                  🏘️ <strong>Accommodation Anti-Scam Notice:</strong> Physically inspect any lodge or self-con at 82 Bus Stop, Ndoro, Ahiaeke or Uturu and verify the caretaker/landlord before paying rent.
                </div>

                <div className="grid gap-5 sm:grid-cols-2">
                  {accommodation.filter((a) => matchesFilter(a, [a.title, a.area, a.description])).map((acc) => (
                    <div key={acc.id} className="flex flex-col justify-between rounded-2xl border border-blue-800/50 bg-slate-900/90 p-5 shadow-lg">
                      <div>
                        <div className="flex items-center justify-between">
                          <span className={`rounded-full px-3 py-0.5 text-[11px] font-bold ${
                            acc.type.includes("Roommate") ? "bg-amber-500 text-slate-950" : "bg-blue-600 text-white"
                          }`}>
                            {acc.type}
                          </span>
                          <span className="text-xs text-blue-300">📍 {acc.area}</span>
                        </div>
                        <h3 className="mt-3 text-base font-extrabold text-white">{acc.title}</h3>
                        <p className="mt-1 text-xs text-blue-100/80">{acc.description}</p>
                        <p className="mt-3 text-lg font-black text-amber-400">{acc.price}</p>
                      </div>
                      <div className="mt-4 flex gap-2">
                        <a href={`https://wa.me/${formatWhatsApp(acc.whatsapp)}`} target="_blank" rel="noopener noreferrer"
                           className="flex-1 rounded-xl bg-green-600 py-2.5 text-center text-xs font-bold text-white hover:bg-green-500">
                          Chat Caretaker / Roommate
                        </a>
                        <button onClick={() => handleReport(acc.title, "Accommodation")} className="rounded-xl border border-blue-800 px-3 text-xs text-blue-300 hover:text-rose-400">
                          🚩 Report
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* ====================================================================
               SECTION 9: COMMUNITIES & GROUPS
               ==================================================================== */}
            {activeSection === "communities" && (
              <section>
                <div className="mb-5 rounded-2xl border border-blue-800/50 bg-blue-950/60 p-5">
                  <span className="text-xs font-bold uppercase text-amber-400">Interest-Based Hubs</span>
                  <h2 className="text-2xl font-extrabold text-white">💬 Campus Communities & Groups</h2>
                  <p className="text-xs text-blue-200/80">Join communities for programming, football, entrepreneurship, freelancers and campus life.</p>
                </div>

                <div className="grid gap-5 md:grid-cols-2">
                  {communities.map((c) => (
                    <div key={c.id} className="flex flex-col justify-between rounded-2xl border border-blue-800/50 bg-slate-900/90 p-5">
                      <div>
                        <div className="flex items-center justify-between">
                          <span className="rounded-full bg-blue-600/30 border border-blue-500/40 px-2.5 py-0.5 text-xs font-bold text-blue-200">{c.category}</span>
                          <span className="text-xs font-bold text-amber-400">👥 {c.members} Members</span>
                        </div>
                        <h3 className="mt-3 text-lg font-extrabold text-white">{c.name}</h3>
                        <p className="text-xs text-blue-300">Admin: {c.admin}</p>
                        <p className="mt-2 text-xs text-blue-100/80">{c.description}</p>
                        <div className="mt-3 rounded-xl bg-slate-950/80 p-3 text-xs text-emerald-300">
                          📌 <strong>Latest Discussion:</strong> {c.latestPost}
                        </div>
                      </div>
                      <button
                        onClick={() => {
                          setJoinedGroups((g) => ({ ...g, [c.id]: !g[c.id] }));
                          setToast(joinedGroups[c.id] ? `Left ${c.name}` : `Joined ${c.name}!`);
                        }}
                        className={`mt-4 w-full rounded-xl py-2.5 text-xs font-bold transition ${
                          joinedGroups[c.id] ? "bg-emerald-600/20 border border-emerald-500/40 text-emerald-300" : "bg-blue-600 text-white hover:bg-blue-500"
                        }`}>
                        {joinedGroups[c.id] ? "✔ Joined Community" : "+ Join Community"}
                      </button>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* ====================================================================
               SECTION 10: VERIFIED & POPULAR BLOGGERS
               ==================================================================== */}
            {activeSection === "bloggers" && (
              <section>
                <div className="mb-5 rounded-2xl border border-blue-800/50 bg-blue-950/60 p-5">
                  <span className="text-xs font-bold uppercase text-amber-400">Campus Journalism & Insights</span>
                  <h2 className="text-2xl font-extrabold text-white">✍️ Verified & Popular Bloggers</h2>
                  <p className="text-xs text-blue-200/80">
                    <strong>Verified Bloggers</strong> are identity-reviewed by our team. <strong>Popular Bloggers</strong> earn their badge through consistent reader engagement—never just by paying.
                  </p>
                </div>

                <div className="grid gap-5 md:grid-cols-3">
                  {bloggers.map((b) => (
                    <article key={b.id} className="flex flex-col justify-between rounded-2xl border border-blue-800/50 bg-slate-900/90 p-5">
                      <div>
                        <div className="flex items-center justify-between gap-2">
                          <span className="rounded-full bg-emerald-500/20 border border-emerald-400/40 px-2.5 py-0.5 text-[10px] font-bold text-emerald-300">
                            ✔ {b.badge}
                          </span>
                          {b.popular && (
                            <span className="rounded-full bg-amber-500/20 px-2 py-0.5 text-[10px] font-bold text-amber-300">
                              🔥 Popular
                            </span>
                          )}
                        </div>
                        <h3 className="mt-3 text-base font-extrabold text-white">{b.title}</h3>
                        <p className="mt-1 text-xs text-blue-300">By {b.author} • {b.time} • {b.reads}</p>
                        <p className="mt-2.5 text-xs text-blue-100/80">{b.excerpt}</p>
                      </div>
                      <button
                        onClick={() => setToast(`Following ${b.author}! You'll be notified of new articles.`)}
                        className="mt-4 w-full rounded-xl border border-blue-600 bg-blue-600/20 py-2 text-xs font-bold text-blue-200 hover:bg-blue-600 hover:text-white">
                        + Follow Blogger
                      </button>
                    </article>
                  ))}
                </div>
              </section>
            )}

            {/* ====================================================================
               SECTION 11: FOOD & RESTAURANTS DIRECTORY
               ==================================================================== */}
            {activeSection === "food" && (
              <section>
                <div className="mb-5 rounded-2xl border border-blue-800/50 bg-blue-950/60 p-5">
                  <span className="text-xs font-bold uppercase text-amber-400">Daily Campus Dining</span>
                  <h2 className="text-2xl font-extrabold text-white">🍲 Food & Restaurants Directory</h2>
                  <p className="text-xs text-blue-200/80">Explore menus, opening hours and direct WhatsApp contacts for restaurants and food vendors around MOUAU & Umudike.</p>
                </div>

                <div className="grid gap-5 md:grid-cols-3">
                  {food.map((f) => (
                    <div key={f.id} className="flex flex-col justify-between rounded-2xl border border-blue-800/50 bg-slate-900/90 p-5">
                      <div>
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-amber-400">{f.rating}</span>
                          <span className="text-xs text-emerald-400">🕒 {f.hours}</span>
                        </div>
                        <h3 className="mt-2 text-base font-extrabold text-white">{f.name}</h3>
                        <p className="text-xs text-blue-300">📍 {f.location}</p>
                        <p className="mt-2 text-xs text-blue-100/85"><strong>Menu Highlights:</strong> {f.specialty}</p>
                        <p className="mt-2 text-sm font-black text-amber-400">{f.priceRange}</p>
                      </div>
                      <a href={`https://wa.me/${formatWhatsApp(f.whatsapp)}`} target="_blank" rel="noopener noreferrer"
                         className="mt-4 block w-full rounded-xl bg-green-600 py-2.5 text-center text-xs font-bold text-white hover:bg-green-500">
                        View Menu / Order on WhatsApp
                      </a>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* ====================================================================
               SECTION 12: LOST & FOUND
               ==================================================================== */}
            {activeSection === "lostfound" && (
              <section>
                <div className="mb-5 flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-blue-800/50 bg-blue-950/60 p-5">
                  <div>
                    <span className="text-xs font-bold uppercase text-amber-400">Community Help</span>
                    <h2 className="text-2xl font-extrabold text-white">🔍 Lost & Found Board</h2>
                    <p className="text-xs text-blue-200/80">Report lost student ID cards, wallets, phones or keys—or help return a found item safely.</p>
                  </div>
                  <button onClick={() => setPostModalOpen(true)} className="rounded-xl bg-amber-500 px-4 py-2.5 text-xs font-extrabold text-slate-950">
                    + Report Lost / Found Item
                  </button>
                </div>

                <div className="grid gap-5 md:grid-cols-3">
                  {lostFound.map((lf) => (
                    <div key={lf.id} className="flex flex-col justify-between rounded-2xl border border-blue-800/50 bg-slate-900/90 p-5">
                      <div>
                        <div className="flex items-center justify-between">
                          <span className={`rounded-full px-3 py-0.5 text-[10px] font-black uppercase ${
                            lf.status === "LOST" ? "bg-rose-500 text-white" : "bg-emerald-500 text-slate-950"
                          }`}>
                            {lf.status}
                          </span>
                          <span className="text-xs text-blue-300">{lf.date}</span>
                        </div>
                        <h3 className="mt-3 text-base font-bold text-white">{lf.title}</h3>
                        <p className="mt-1 text-xs text-amber-400">📍 {lf.location}</p>
                        <p className="mt-2 text-xs text-blue-100/80">{lf.description}</p>
                      </div>
                      <a href={`https://wa.me/${formatWhatsApp(lf.whatsapp)}`} target="_blank" rel="noopener noreferrer"
                         className="mt-4 block w-full rounded-xl bg-blue-600 py-2.5 text-center text-xs font-bold text-white hover:bg-blue-500">
                        Contact Owner / Finder
                      </a>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* ====================================================================
               SECTION 13: WHAT'S NEW, FEATURE ROADMAP & SUGGEST A FEATURE
               ==================================================================== */}
            {activeSection === "roadmap" && (
              <section className="space-y-6">
                <div className="rounded-2xl border border-blue-800/50 bg-blue-950/60 p-5">
                  <span className="text-xs font-bold uppercase text-amber-400">Actively Developed Campus Platform</span>
                  <h2 className="text-2xl font-extrabold text-white">🚀 What's New, Feature Roadmap & Suggestions</h2>
                  <p className="text-xs text-blue-200/80">
                    Welcome to MOUAU Connect. We're building a better community experience in stages based on real student feedback.
                  </p>
                </div>

                {/* Roadmap Phases */}
                <div className="grid gap-5 md:grid-cols-3">
                  {ROADMAP_ITEMS.map((r) => (
                    <div key={r.phase} className="rounded-2xl border border-blue-800/50 bg-slate-900/90 p-5">
                      <span className={`rounded-full border px-3 py-0.5 text-xs font-bold ${r.color}`}>
                        {r.status}
                      </span>
                      <h3 className="mt-3 text-base font-extrabold text-white">{r.phase}</h3>
                      <ul className="mt-3 space-y-1.5 text-xs text-blue-200/85">
                        {r.items.map((it) => <li key={it}>• {it}</li>)}
                      </ul>
                    </div>
                  ))}
                </div>

                {/* Suggest a Feature & Upvote */}
                <div className="rounded-2xl border border-blue-800/50 bg-slate-900/90 p-5">
                  <h3 className="text-lg font-extrabold text-white">💡 Suggest a Feature for MOUAU Connect</h3>
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      if (!newSuggestion.trim()) return;
                      setSuggestions((prev) => [{ id: Date.now(), text: newSuggestion.trim(), votes: 1 }, ...prev]);
                      setNewSuggestion("");
                      setToast("Thank you! Your feature suggestion is now live for community voting.");
                    }}
                    className="mt-3 flex flex-wrap gap-2">
                    <input
                      value={newSuggestion}
                      onChange={(e) => setNewSuggestion(e.target.value)}
                      placeholder="e.g. I would like MOUAU Connect to have a section for past exam tutorials…"
                      className={`${inputCls} flex-1`}
                    />
                    <button type="submit" className="rounded-xl bg-green-600 px-5 py-2.5 text-xs font-extrabold text-white hover:bg-green-500">
                      Submit Suggestion
                    </button>
                  </form>

                  <div className="mt-4 space-y-2">
                    {suggestions.map((sg) => (
                      <div key={sg.id} className="flex items-center justify-between rounded-xl bg-slate-950/80 border border-blue-900/50 p-3">
                        <span className="text-xs text-blue-100">{sg.text}</span>
                        <button
                          onClick={() => {
                            setSuggestions((prev) => prev.map((x) => (x.id === sg.id ? { ...x, votes: x.votes + 1 } : x)));
                            setToast("Upvoted feature suggestion!");
                          }}
                          className="shrink-0 rounded-lg bg-blue-600/30 border border-blue-500/40 px-3 py-1 text-xs font-bold text-amber-300 hover:bg-blue-600 hover:text-white">
                          ▲ {sg.votes} Upvotes
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            )}
          </main>

          {/* Direct Message Modal */}
          {dmTarget && (
            <div className="fixed inset-0 z-[75] flex items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm" onClick={() => setDmTarget(null)}>
              <div onClick={(e) => e.stopPropagation()} className="pop-in w-full max-w-md rounded-3xl border border-blue-700 bg-slate-900 p-6 shadow-2xl">
                <h3 className="text-base font-extrabold text-white">💬 Message {dmTarget.name}</h3>
                <p className="text-xs text-blue-300">{dmTarget.dept} • {dmTarget.school}</p>
                <textarea
                  rows={3}
                  value={dmText}
                  onChange={(e) => setDmText(e.target.value)}
                  placeholder={`Say hi to ${dmTarget.name.split(" ")[0]}…`}
                  className={`${inputCls} mt-3`}
                />
                <div className="mt-3 flex gap-2">
                  <button
                    onClick={() => {
                      setToast(`Message sent to ${dmTarget.name}!`);
                      setDmText("");
                      setDmTarget(null);
                    }}
                    className="flex-1 rounded-xl bg-blue-600 py-2.5 text-xs font-bold text-white">
                    Send In-App Message
                  </button>
                  <a
                    href={`https://wa.me/${formatWhatsApp(dmTarget.whatsapp)}?text=${encodeURIComponent(dmText || `Hi ${dmTarget.name.split(" ")[0]}, connecting with you from MOUAU Connect!`) }`}
                    target="_blank" rel="noopener noreferrer"
                    className="flex-1 rounded-xl bg-green-600 py-2.5 text-center text-xs font-bold text-white">
                    Open WhatsApp
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* Footer with Independent Platform Disclaimer */}
          <footer className="border-t border-blue-900/60 bg-slate-950/90 py-6 text-center text-xs text-blue-300/70">
            <p className="font-bold text-white">MOUAU Connect — “Connecting People. Creating Opportunities. Building Communities.”</p>
            <p className="mt-1">
              Independent community-driven digital ecosystem serving students, young people & businesses around MOUAU, Umudike and surrounding communities.
            </p>
          </footer>

          <UniversalPostModal />
          <SponsoredAdModal />
          <AdminDashboardModal />
          <Toast message={toast} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
